name: Docker Build and Publish

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Release workflow run ID to download artifacts from'
        required: false
      channel:
        description: 'Release channel (beta/alpha never get the latest tag)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: stable
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'
      version:
        description: 'Semver version (stable: 1.2.3 -> X.Y.Z and X.Y tags; beta/alpha: e.g. 1.3.0-beta.1)'
        required: false
      as-latest:
        description: 'Also tag as latest (stable channel only)'
        required: false
        type: boolean
        default: true
      scout:
        description: 'Run Docker Scout for CVE scanning'
        required: false
        type: boolean
        default: false

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      # Primary Docker Hub account
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/simon
      # Previous Docker Hub account, kept up to date so existing pulls don't break
      LEGACY_IMAGE: ${{ secrets.DOCKERHUB_LEGACY_USERNAME }}/simon
      HAS_LEGACY: ${{ secrets.DOCKERHUB_LEGACY_USERNAME != '' && secrets.DOCKERHUB_LEGACY_USERNAME != secrets.DOCKERHUB_USERNAME }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from Release workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: release.yml
          name: simon-binaries
          path: bin-releases/
          run_id: ${{ inputs.run-id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: |
          echo "Downloaded binaries:"
          ls -lh bin-releases/

      - name: Resolve version tags
        id: semver
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          AS_LATEST: ${{ inputs.as-latest }}
        run: |
          VERSION="${VERSION#v}"
          MAJOR_MINOR=""
          LATEST="false"

          if [ "$CHANNEL" = "stable" ]; then
            if [[ "$VERSION" == *-* ]]; then
              echo "::error::Version '$VERSION' looks like a prerelease; pick the beta or alpha channel instead."
              exit 1
            fi
            [ -n "$VERSION" ] && MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
            LATEST="$AS_LATEST"
          else
            if [ -n "$VERSION" ] && [[ "$VERSION" != *-"$CHANNEL"* ]]; then
              echo "::error::Version for the $CHANNEL channel must carry a -$CHANNEL suffix (e.g. 1.3.0-$CHANNEL.1), got '$VERSION'."
              exit 1
            fi
            [ "$AS_LATEST" = "true" ] && echo "::notice::Ignoring as-latest for the $CHANNEL channel."
          fi

          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.semver.outputs.latest == 'true' }}
            type=raw,value=${{ inputs.channel }},enable=${{ inputs.channel != 'stable' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.version == '' && inputs.tag != 'latest' && inputs.tag != '' }}
            type=raw,value=${{ steps.semver.outputs.full }},enable=${{ steps.semver.outputs.full != '' }}
            type=raw,value=${{ steps.semver.outputs.major_minor }},enable=${{ steps.semver.outputs.major_minor != '' }}

      - name: Check tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::No tags to publish. Set a version, a custom tag, or enable as-latest."
            exit 1
          fi
          echo "Publishing tags:"
          echo "$TAGS"

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Attest Docker Hub before switching the docker.io login to the legacy account
      - name: Generate artifact attestation for Docker Hub
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for GHCR
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Docker Scout (optional)
        if: ${{ inputs.scout }}
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          exit-code: false

      - name: Legacy Docker Hub account not configured
        if: ${{ env.HAS_LEGACY != 'true' }}
        run: echo "::warning::DOCKERHUB_LEGACY_USERNAME is not set (or matches DOCKERHUB_USERNAME); skipping legacy mirror."

      # docker.io holds one credential at a time, so the legacy account is
      # logged in last and the already-built image is copied over from GHCR.
      - name: Log in to legacy Docker Hub account
        if: ${{ env.HAS_LEGACY == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LEGACY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LEGACY_TOKEN }}

      - name: Mirror image to legacy Docker Hub account
        id: legacy
        if: ${{ env.HAS_LEGACY == 'true' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          args=()
          first=""
          while IFS= read -r tag; do
            [[ "$tag" == "$DOCKERHUB_IMAGE:"* ]] || continue
            name="${tag#"$DOCKERHUB_IMAGE:"}"
            [ -z "$first" ] && first="$name"
            args+=(-t "$LEGACY_IMAGE:$name")
          done <<< "$TAGS"

          docker buildx imagetools create "${args[@]}" "$SOURCE"

          digest=$(docker buildx imagetools inspect "$LEGACY_IMAGE:$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> $GITHUB_OUTPUT

      - name: Generate artifact attestation for legacy Docker Hub account
        if: ${{ env.HAS_LEGACY == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ env.LEGACY_IMAGE }}
          subject-digest: ${{ steps.legacy.outputs.digest }}
          push-to-registry: true
