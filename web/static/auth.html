<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Simon - Authentication</title>
		<script>
			try {
				var t = localStorage.getItem('simon-theme');
				if (t !== 'light' && t !== 'dark')
					t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: 'Inter', sans-serif;
			}
			:root {
				color-scheme: dark;
				--fg-rgb: 255, 255, 255;
				--bg: #0f0f13;
				--bg-alt: #171721;
				--text: #e1e1e3;
				--card-bg: rgba(255, 255, 255, 0.03);
				--card-border: rgba(255, 255, 255, 0.05);
				--shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
				--accent: #4ade80;
				--blue: #3b82f6;
				background: var(--bg-alt);
			}
			:root[data-theme='light'] {
				color-scheme: light;
				--fg-rgb: 15, 23, 42;
				--bg: #e9ecf2;
				--bg-alt: #f6f7fa;
				--text: #1f2330;
				--card-bg: #ffffff;
				--card-border: rgba(15, 23, 42, 0.08);
				--shadow: 0 4px 20px 0 rgba(15, 23, 42, 0.08);
				--accent: #15803d;
				--blue: #2563eb;
			}
			[data-theme='light'] h1 {
				text-shadow: none;
			}
			body {
				background: var(--bg);
				color: var(--text);
				padding: 2rem;
				min-height: 100vh;
				background: linear-gradient(135deg, var(--bg) 0%, var(--bg-alt) 100%);
			}

			h1 {
				text-align: center;
				margin-bottom: 2rem;
				font-size: 2.5rem;
				background: linear-gradient(45deg, var(--accent), var(--blue));
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				text-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
			}

			.dashboard {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: calc(100vh - 4rem);
				max-width: 1200px;
				margin: 0 auto;
			}

			.auth-card {
				background: var(--card-bg);
				border-radius: 15px;
				padding: 2rem;
				backdrop-filter: blur(10px);
				border: 1px solid var(--card-border);
				box-shadow: var(--shadow);
				transition: all 0.3s ease;
				width: 100%;
				max-width: 400px;
			}

			.auth-card:hover {
				border-color: rgba(var(--fg-rgb), 0.1);
				box-shadow: 0 8px 32px 0 rgba(74, 222, 128, 0.1);
			}

			.form-group {
				margin-bottom: 1.5rem;
			}

			input {
				width: 100%;
				padding: 0.8rem 1rem;
				background: rgba(var(--fg-rgb), 0.05);
				border: 1px solid rgba(var(--fg-rgb), 0.1);
				color: var(--text);
				border-radius: 8px;
				font-size: 1rem;
				transition: all 0.3s ease;
			}

			input:focus {
				outline: none;
				border-color: rgba(74, 222, 128, 0.5);
				box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
			}

			input::placeholder {
				color: rgba(var(--fg-rgb), 0.5);
			}

			.auth-button {
				width: 100%;
				padding: 0.8rem;
				background: linear-gradient(90deg, var(--blue), var(--accent));
				border: none;
				border-radius: 8px;
				color: white;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s ease;
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.auth-button:hover {
				opacity: 0.9;
				transform: translateY(-2px);
				box-shadow: 0 4px 12px rgba(74, 222, 128, 0.2);
			}

			.auth-button:disabled {
				opacity: 0.7;
				cursor: not-allowed;
				transform: none;
			}

			.error-message {
				background: rgba(239, 68, 68, 0.1);
				color: rgb(239, 68, 68);
				padding: 0.8rem;
				border-radius: 8px;
				margin-bottom: 1.5rem;
				text-align: center;
				font-size: 0.9rem;
				display: none;
			}

			.loading-spinner {
				width: 20px;
				height: 20px;
				border: 2px solid rgba(255, 255, 255, 0.3);
				border-radius: 50%;
				border-top-color: white;
				animation: spin 0.8s linear infinite;
				display: inline-block;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			@media (max-width: 480px) {
				.auth-card {
					padding: 1.5rem;
					margin: 0 1rem;
				}

				h1 {
					font-size: 2rem;
					margin-bottom: 1.5rem;
				}

				body {
					padding: 0;
				}
			}
		</style>
	</head>
	<body>
		<div class="dashboard">
			<div class="auth-card">
				<h1>Simon</h1>
				<form id="authForm">
					<div class="form-group">
						<input
							type="password"
							id="password"
							placeholder="Enter password"
							autocomplete="current-password"
							required
						/>
					</div>

					<div id="errorMessage" class="error-message"></div>

					<button type="submit" class="auth-button" id="submitButton">Sign In</button>
				</form>
			</div>
		</div>

		<script>
			let password = '';
			let error = '';
			let loading = false;

			const passwordInput = document.getElementById('password');
			const errorElement = document.getElementById('errorMessage');
			const submitButton = document.getElementById('submitButton');
			const authForm = document.getElementById('authForm');

			passwordInput.addEventListener('input', function (e) {
				password = e.target.value;
			});

			authForm.addEventListener('submit', async function (e) {
				e.preventDefault();
				handleSubmit();
			});

			async function handleSubmit() {
				setLoading(true);
				clearError();

				try {
					const url = window.location.href;

					const res = await fetch(url, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/x-www-form-urlencoded'
						},
						body: new URLSearchParams({ password }).toString()
					});

					if (res.status === 200) {
						window.location.href = window.location.href.slice(0, -'auth'.length);
					} else if (res.status === 401) {
						showError('Wrong password');
					} else {
						showError('Connection error. Please try again.');
					}
				} catch (e) {
					showError('Connection error. Please try again.');
				} finally {
					setLoading(false);
				}
			}

			function setLoading(isLoading) {
				loading = isLoading;
				submitButton.disabled = isLoading;

				if (isLoading) {
					submitButton.innerHTML = '<span class="loading-spinner"></span>';
				} else {
					submitButton.textContent = 'Sign In';
				}
			}

			function showError(message) {
				error = message;
				errorElement.textContent = message;
				errorElement.style.display = 'block';
			}

			function clearError() {
				error = '';
				errorElement.textContent = '';
				errorElement.style.display = 'none';
			}
		</script>
	</body>
</html>
